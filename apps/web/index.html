<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="theme-color-meta" name="theme-color" content="#040711" />
    <!-- La app tiene su propio tema (claro/oscuro) y lo aplica antes del primer
         pintado. Dark Reader, la extensión que reescribe colores, no puede
         convivir con eso: sus reglas le ganan a las nuestras y dejan la paleta
         mezclada (el fondo de un tema con los paneles del otro). Este meta es el
         mecanismo oficial para que no toque la página. -->
    <meta name="darkreader-lock" />
    <script>
      // El tema se aplica ACÁ, antes del primer pintado, y no en un efecto de
      // React: el efecto corre después de montar, así que al recargar se veía un
      // frame con la paleta por defecto y recién después la elegida. Lee la
      // misma clave que la app ("bonafide-theme").
      (() => {
        let theme = "dark";
        try {
          const stored = localStorage.getItem("bonafide-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          }
        } catch {
          // Sin almacenamiento disponible queda el tema por defecto.
        }
        document.documentElement.dataset.theme = theme;
        const meta = document.getElementById("theme-color-meta");
        if (meta) {
          meta.setAttribute("content", theme === "light" ? "#dbe5f1" : "#040711");
        }
      })();
    </script>
    <!-- /favicon.svg se declara a proposito: esa ruta ya existia antes y el navegador
         guarda su propio registro de iconos. Si la ruta no devuelve una imagen real
         (aqui el SPA responde HTML en rutas inexistentes), el navegador no puede
         actualizar el registro viejo y el marcador sigue mostrando el icono anterior. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-v5.png" sizes="256x256" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v5.png" />
    <link rel="manifest" href="/site.webmanifest?v=5" />
    <!-- La portada del server, para que el link se vea al compartirlo (Discord,
         WhatsApp, X). Sin esto el enlace sale sin imagen.
         `og:image` necesita URL ABSOLUTA (los scrapers no resuelven rutas
         relativas ni ejecutan JavaScript), por eso la base sale de VITE_SITE_URL:
         en producción es el dominio del hub. -->
    <meta property="og:title" content="Bonafide Hub" />
    <meta
      property="og:description"
      content="El hub de la comunidad: roster, eventos, raids y ranking."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-cover.png" />
    <title>Bonafide Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
