name: Memory Restart

# Railway factura la memoria del contenedor, y esa cifra incluye la cache de
# archivos del kernel. Esa cache no se libera sola: crece hasta que el
# contenedor se reinicia (adentro, memory.reclaim es de solo lectura).
#
# El API y el bot se auto-reinician por umbral (ver memory-guard en cada app),
# pero Web y Postgres no tienen codigo nuestro, asi que se reciclan desde aca.
#
# Requiere UNO de estos secrets (el que sea mas facil de crear):
#
#   RAILWAY_API_TOKEN  -> token de workspace. Se crea en
#                         https://railway.com/account/tokens eligiendo el
#                         workspace en el desplegable. Recomendado, porque la
#                         pagina existe y se llega derecho.
#   RAILWAY_TOKEN      -> token de proyecto. Se crea en los settings del
#                         proyecto, en la seccion Tokens. Es el de menor
#                         alcance, pero esta mas escondido en la UI.
#
# La creacion de tokens NO se puede hacer desde el CLI: responde Not Authorized.

on:
  schedule:
    # Lunes 06:00 UTC = 03:00 en Argentina (UTC-3, sin horario de verano).
    # El cron de GitHub siempre va en UTC, así que la hora local se calcula
    # sumando 3.
    - cron: "0 6 * * 1"
  # Para probarlo sin esperar al lunes.
  workflow_dispatch:

concurrency:
  group: memory-restart
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Restart Web and PRD_DB
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: 9d0c57e7-82d7-4556-973c-c255f1ac7db1
          RAILWAY_ENVIRONMENT_ID: 0a0252c9-b424-4203-bbe6-c314c17ee8ef
        run: |
          # El token de proyecto ya viene atado a un proyecto y un entorno, así
          # que el CLI lo resuelve solo. El de workspace no: ese necesita las
          # banderas explícitas.
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "Usando token de proyecto (RAILWAY_TOKEN)"
            CON_FLAGS=""
          elif [ -n "$RAILWAY_API_TOKEN" ]; then
            echo "Usando token de workspace (RAILWAY_API_TOKEN)"
            CON_FLAGS="--project $RAILWAY_PROJECT_ID --environment $RAILWAY_ENVIRONMENT_ID"
          else
            echo "::error::Falta un secret: RAILWAY_API_TOKEN (https://railway.com/account/tokens) o RAILWAY_TOKEN (settings del proyecto, seccion Tokens)"
            exit 1
          fi
          for service in Web PRD_DB; do
            echo "Reiniciando $service"
            # shellcheck disable=SC2086 # CON_FLAGS se expande a propósito.
            if railway redeploy --service "$service" --yes $CON_FLAGS; then
              continue
            fi
            # Si esa versión del CLI pide lo contrario de lo que se dedujo, se
            # reintenta con las banderas para no fallar el lunes por esto.
            echo "Reintentando $service con --project/--environment explícitos"
            railway redeploy --service "$service" --yes \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID"
          done
