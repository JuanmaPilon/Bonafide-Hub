name: Repository Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  hygiene-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check merge conflict markers
        run: |
          if grep -RInE "^(<<<<<<<|=======|>>>>>>>)" . --exclude-dir=.git; then
            echo "Conflict markers detected"
            exit 1
          fi

      - name: Block committed .env files
        run: |
          if git ls-files | grep -E "(^|/)\.env($|\.)"; then
            echo "Tracked .env files are not allowed"
            exit 1
          fi

      - name: Validate minimal structure
        run: |
          test -d apps
          test -d packages
          test -f README.md
